name: Alist Stream to Telegram

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL of the video file'
        required: true
      rtmp_url:
        description: 'Target RTMP URL'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 最大运行 6 小时

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Streaming
        run: |
          FILE_URL="${{ inputs.file_url }}"
          RTMP_URL="${{ inputs.rtmp_url }}"
          
          echo "Target: RTMP Server"
          # 隐藏敏感 URL 避免日志泄露
          echo "Starting stream..."
          
          # FFmpeg 优化参数说明:
          # -re: 实时读取 (Real-time)
          # -headers: 伪装 User-Agent，防止某些网盘直接拒绝
          # -reconnect 1: 开启断线重连
          # -reconnect_streamed 1: 允许流式重连
          # -reconnect_delay_max 5: 最大重连等待时间
          # -i: 输入 URL
          # -c:v copy -c:a copy: 直接推流不转码 (Copy mode)
          # -bsf:a aac_adtstoasc: 修复 TS/FLV 容器的 AAC 音频流格式
          # -f flv: 输出格式为 flv (RTMP 标准)
          
          ffmpeg \
            -re \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$FILE_URL" \
            -c:v copy -c:a copy \
            -bsf:a aac_adtstoasc \
            -f flv "$RTMP_URL"
