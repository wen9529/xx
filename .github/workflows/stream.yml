name: Alist Stream to Telegram

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL of the video file'
        required: true
      rtmp_url:
        description: 'Target RTMP URL'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 最大运行 6 小时

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Streaming
        run: |
          FILE_URL="${{ inputs.file_url }}"
          RTMP_URL="${{ inputs.rtmp_url }}"
          
          echo "Source: $FILE_URL"
          echo "Target: RTMP Server"
          
          # FFmpeg 推流命令
          # -re: 按本机帧率读取输入（模拟实时流）
          # -i: 输入文件
          # -c:v copy -c:a copy: 直接复制流，不转码（节省 CPU，速度最快，但要求源文件编码兼容）
          # 如果遇到编码问题，可以将 -c:v copy 改为 -c:v libx264 -preset veryfast -b:v 4000k
          
          ffmpeg -re -i "$FILE_URL" -c:v copy -c:a aac -strict experimental -f flv "$RTMP_URL"
