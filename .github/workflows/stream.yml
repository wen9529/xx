name: Alist Stream to Telegram

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL of the video file'
        required: true
      rtmp_url:
        description: 'Target RTMP URL'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 最大运行 6 小时

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Streaming
        run: |
          FILE_URL="${{ inputs.file_url }}"
          RTMP_URL="${{ inputs.rtmp_url }}"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
          
          echo "🔍 Analyzing stream info..."
          
          # 1. 探测视频编码
          V_CODEC=$(ffprobe -v error -user_agent "$UA" -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$FILE_URL" || echo "")
          
          echo "📋 Detected Video Codec: [$V_CODEC]"
          
          # --- 视频处理逻辑 ---
          # 修复画面拉伸：强制标准化为 1920x1080，保持原比例，不足部分填充黑边
          # 这样可以防止 Telegram 播放器强行拉伸画面
          
          # 基础参数
          # -pix_fmt yuv420p: 确保兼容性
          # -g 60: 关键帧间隔 2秒
          # -preset veryfast: 保证推流流畅度
          COMMON_OPTS="-map 0:v:0 -map 0:a:0 -pix_fmt yuv420p -g 60 -sc_threshold 0"
          
          # 强制 1080P + 黑边填充滤镜
          VIDEO_FILTER="scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2"
          
          if [ "$V_CODEC" == "h264" ]; then
            # 即使是 H264，如果不想拉伸，最好也转码一下加黑边。
            # 但为了性能，如果用户坚持原画，可以使用 copy。
            # 不过为了解决您提到的“扭曲”问题，我们这里强制转码并规范化分辨率。
            echo "ℹ️ Enforcing 1080p normalization to fix aspect ratio distortion."
            VIDEO_OPTS="-c:v libx264 -preset veryfast $COMMON_OPTS -vf \"$VIDEO_FILTER\""
          else
            echo "⚠️ Transcoding to H.264 (High CPU)."
            VIDEO_OPTS="-c:v libx264 -preset veryfast $COMMON_OPTS -vf \"$VIDEO_FILTER\""
          fi
          
          # --- 音频处理逻辑 ---
          # 强制 AAC 128k
          AUDIO_OPTS="-c:a aac -b:a 128k -ar 44100"
          
          echo "🚀 Starting FFmpeg..."
          
          ffmpeg \
            -re \
            -user_agent "$UA" \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$FILE_URL" \
            $VIDEO_OPTS $AUDIO_OPTS \
            -f flv "$RTMP_URL"
