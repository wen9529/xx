name: Alist Stream to Telegram

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL of the video file'
        required: true
      rtmp_url:
        description: 'Target RTMP URL'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 最大运行 6 小时

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Streaming
        run: |
          FILE_URL="${{ inputs.file_url }}"
          RTMP_URL="${{ inputs.rtmp_url }}"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
          
          echo "🔍 Analyzing stream info..."
          
          # 使用 ffprobe 检测视频编码
          # 如果检测失败，默认为空，触发转码逻辑
          V_CODEC=$(ffprobe -v error -user_agent "$UA" -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$FILE_URL" || echo "")
          
          echo "📋 Detected Video Codec: [$V_CODEC]"
          
          # --- 视频处理逻辑 ---
          # Telegram 直播必须是 H.264。如果源文件已经是 H.264，则使用 copy 模式（省资源）。
          # 否则，进行转码（libx264）。
          if [ "$V_CODEC" == "h264" ]; then
            echo "✅ Source is H.264. Using copy mode (Low CPU)."
            VIDEO_OPTS="-c:v copy"
          else
            echo "⚠️ Source is not H.264 (or detection failed). Transcoding to H.264 (High CPU)."
            # -preset veryfast: 保证推流速度
            # -g 60: 关键帧间隔 2秒 (30fps)
            VIDEO_OPTS="-c:v libx264 -preset veryfast -g 60 -sc_threshold 0"
          fi
          
          # --- 音频处理逻辑 ---
          # 强制转码为 AAC。
          # 1. 解决源文件是 MP3 导致 'aac_adtstoasc' 滤镜报错的问题。
          # 2. 确保音频符合 RTMP/FLV 标准。
          AUDIO_OPTS="-c:a aac -b:a 128k -ar 44100"
          
          echo "🚀 Starting FFmpeg..."
          echo "Video Opts: $VIDEO_OPTS"
          echo "Audio Opts: $AUDIO_OPTS"
          
          ffmpeg \
            -re \
            -user_agent "$UA" \
            -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$FILE_URL" \
            $VIDEO_OPTS $AUDIO_OPTS \
            -f flv "$RTMP_URL"
